# Publica a loja no GitHub Pages.
#  - A cada push na branch main, publica a versão atual (deploy normal).
#  - Pela aba Actions > "Deploy no GitHub Pages" > "Run workflow" é possível
#    publicar QUALQUER versão anterior (tag, branch ou commit): é o nosso ROLLBACK.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a publicar (tag como v1.0.0, branch ou SHA). Vazio = main"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Baixar o código da versão escolhida
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.versao || github.sha }}

      - name: Carimbar a versão publicada (build-info.json)
        env:
          REF_PUBLICADA: ${{ inputs.versao || github.ref_name }}
          EVENTO: ${{ github.event_name }}
          EXECUCAO: ${{ github.run_number }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          DATA=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"ref":"%s","commit":"%s","dataDeploy":"%s","evento":"%s","execucao":"%s"}\n' \
            "$REF_PUBLICADA" "$COMMIT" "$DATA" "$EVENTO" "$EXECUCAO" > build-info.json
          echo "Publicando $REF_PUBLICADA (commit $COMMIT) — evento: $EVENTO"
          cat build-info.json

      # Ação corretiva do incidente da release 2.0: impede publicar uma versão
      # cujo catálogo cite capas que não existem na pasta configurada.
      # O script fica aqui (e não num arquivo do repositório) porque o workflow
      # sempre vem da main, enquanto o código publicado pode ser uma tag antiga.
      - name: Validar a release (capas do catálogo existem)
        run: |
          python3 - <<'PY'
          import json, os, sys

          try:
              config = json.load(open('config/app-config.json', encoding='utf-8'))
              catalogo = json.load(open(config['catalogoUrl'], encoding='utf-8'))
          except Exception as erro:
              print(f"::error title=Release bloqueada::configuração ou catálogo inválido: {erro}")
              sys.exit(1)

          pasta = config['pastaCapas']
          jogos = catalogo['jogos']
          faltando = []
          for jogo in jogos:
              caminho = os.path.join(pasta, jogo['capa'])
              existe = os.path.isfile(caminho)
              print(f"{'OK   ' if existe else 'FALTA'} {jogo['id']} -> {caminho}")
              if not existe:
                  faltando.append(caminho)

          if faltando:
              print(f"::error title=Release bloqueada::{len(faltando)} de {len(jogos)} capas do catálogo não existem em '{pasta}'. Deploy interrompido.")
              sys.exit(1)

          print(f"Release aprovada: as {len(jogos)} capas do catálogo existem em '{pasta}'.")
          PY

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
